name: CI/CD Pipeline

on:
    push:
        branches:
            - main
            - develop
    pull_request:
        branches:
            - main
            - develop

env:
    NODE_VERSION: "20.x"

jobs:
    # Job de vérification et tests
    test:
        name: Tests et Linting
        runs-on: ubuntu-latest

        services:
            mongodb:
                image: mongo:latest
                ports:
                    - 27017:27017
                env:
                    MONGO_INITDB_ROOT_USERNAME: test_user
                    MONGO_INITDB_ROOT_PASSWORD: test_password
                options: >-
                    --health-cmd "mongosh --eval 'db.adminCommand({ ping: 1 })'"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        steps:
            - name: Checkout du code
              uses: actions/checkout@v4

            - name: Configuration de Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: "npm"

            - name: Installation des dépendances
              run: npm ci

            - name: Linting
              run: npm run lint

            - name: Exécution des tests
              run: npm run test
              env:
                  MONGODB_URI: mongodb://test_user:test_password@localhost:27017/test?authSource=admin

            - name: Upload des résultats de tests
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: test-results
                  path: coverage/

    # Job de build
    build:
        name: Build de l'application
        runs-on: ubuntu-latest
        needs: test

        steps:
            - name: Checkout du code
              uses: actions/checkout@v4

            - name: Configuration de Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: "npm"

            - name: Installation des dépendances
              run: npm ci

            - name: Build de l'application
              run: npm run build
              env:
                  NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
                  NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
                  NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
                  NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
                  NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
                  NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
                  NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}

            - name: Upload du build
              uses: actions/upload-artifact@v4
              with:
                  name: build
                  path: .next/
                  retention-days: 1

    # Job de déploiement sur Vercel
    deploy-vercel:
        name: Déploiement sur Vercel
        runs-on: ubuntu-latest
        needs: build
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

        steps:
            - name: Checkout du code
              uses: actions/checkout@v4

            - name: Installation de Vercel CLI
              run: npm install --global vercel@latest

            - name: Pull des informations de l'environnement Vercel
              run: vercel pull --yes --environment=${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }} --token=${{ secrets.VERCEL_TOKEN }}
              env:
                  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
                  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

            - name: Build des assets du projet
              run: vercel build ${{ github.ref == 'refs/heads/main' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}
              env:
                  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
                  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

            - name: Déploiement sur Vercel
              id: deploy
              run: |
                  url=$(vercel deploy --prebuilt ${{ github.ref == 'refs/heads/main' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }})
                  echo "url=$url" >> $GITHUB_OUTPUT
              env:
                  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
                  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

            - name: Commentaire avec l'URL de déploiement
              if: github.event_name == 'pull_request'
              uses: actions/github-script@v7
              with:
                  script: |
                      github.rest.issues.createComment({
                        issue_number: context.issue.number,
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        body: `✅ Déployé avec succès sur Vercel!\n\n🔗 URL: ${{ steps.deploy.outputs.url }}`
                      })

    # Job de déploiement Docker (optionnel)
    deploy-docker:
        name: Déploiement Docker
        runs-on: ubuntu-latest
        needs: build
        if: github.ref == 'refs/heads/main'

        steps:
            - name: Checkout du code
              uses: actions/checkout@v4

            - name: Configuration de Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Connexion à Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_PASSWORD }}

            - name: Extraction des métadonnées
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ secrets.DOCKER_USERNAME }}/kubo-app
                  tags: |
                      type=ref,event=branch
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      type=sha

            - name: Build et Push de l'image Docker
              uses: docker/build-push-action@v5
              with:
                  context: .
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/kubo-app:buildcache
                  cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/kubo-app:buildcache,mode=max

    # Job de nettoyage et notifications
    notify:
        name: Notifications
        runs-on: ubuntu-latest
        needs: [test, build, deploy-vercel]
        if: always()

        steps:
            - name: Vérification du statut
              run: |
                  if [ "${{ needs.test.result }}" == "failure" ] || [ "${{ needs.build.result }}" == "failure" ] || [ "${{ needs.deploy-vercel.result }}" == "failure" ]; then
                    echo "❌ Le pipeline a échoué"
                    exit 1
                  else
                    echo "✅ Pipeline exécuté avec succès"
                  fi
