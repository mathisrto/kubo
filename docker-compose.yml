services:
    mongodb:
        image: mongo:latest
        container_name: mongo
        restart: always
        ports:
            - "27017:27017"
        environment:
            MONGO_INITDB_ROOT_USERNAME: ${DATABASE_ROOT_USERNAME}
            MONGO_INITDB_ROOT_PASSWORD: ${DATABASE_ROOT_PASSWORD}
        volumes:
            - ./data/db:/data/db
        healthcheck:
            test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
            interval: 5s
            timeout: 5s
            retries: 5
            start_period: 10s
    mongo-express:
        image: mongo-express
        container_name: mongo-express
        restart: always
        ports:
            - "9382:8081"
        environment:
            ME_CONFIG_BASICAUTH_USERNAME: ${DATABASE_BROWSER_USERNAME}
            ME_CONFIG_BASICAUTH_PASSWORD: ${DATABASE_BROWSER_PASSWORD}
            ME_CONFIG_MONGODB_ADMINUSERNAME: ${DATABASE_ROOT_USERNAME}
            ME_CONFIG_MONGODB_ADMINPASSWORD: ${DATABASE_ROOT_PASSWORD}
            ME_CONFIG_MONGODB_SERVER: mongo
        depends_on:
            mongodb:
                condition: service_healthy
