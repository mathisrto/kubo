# Scalars
scalar ID
scalar JSON

# Types partagés

type Vector3 {
    x: Float!
    y: Float!
    z: Float!
}

type Color {
    r: Float!
    g: Float!
    b: Float!
    a: Float!
}

type MutationResult {
    acknowledged: Boolean!
}

enum CameraType {
    perspective
    orthographic
}

enum LightType {
    point
    directional
    spot
}

enum ModelFileFormat {
    GLTF
    GLB
    OBJ
    FBX
    STL
    PLY
}

# Types principaux

type Model3D {
    id: String
    name: String
    fileId: String
    format: ModelFileFormat
    position: Vector3
    rotation: Vector3
    scale: Vector3
    materialId: String
    metadata: JSON
}

type Light {
    id: String
    name: String
    position: Vector3
    color: Color
    intensity: Float
    range: Float
    type: LightType
    colorMultiplier: Float
}

type Material {
    id: String
    name: String
    albedo: Color
    metallic: Float
    roughness: Float
    ao: Float
    emissive: Color
}

type Camera {
    position: Vector3
    target: Vector3
    fov: Float
    near: Float
    far: Float
    type: CameraType
}

type AmbientLight {
    intensity: Float
    environmentMap: String
}

type Scene {
    models3d: [Model3D!]!
    lights: [Light!]!
    materials: [Material!]!
    camera: Camera!
    ambientLight: AmbientLight!
    createdAt: String!
    updatedAt: String!
}

# Input types

input Vector3Input {
    x: Float!
    y: Float!
    z: Float!
}

input ColorInput {
    r: Float!
    g: Float!
    b: Float!
    a: Float!
}

input LightInput {
    id: String!
    name: String
    position: Vector3Input
    color: ColorInput
    intensity: Float
    range: Float
    type: LightType
    colorMultiplier: Float
}

input MaterialInput {
    id: String!
    name: String
    albedo: ColorInput
    metallic: Float
    roughness: Float
    ao: Float
    emissive: ColorInput
}

input Model3DInput {
    id: String!
    name: String
    fileId: String!
    format: ModelFileFormat
    position: Vector3Input
    rotation: Vector3Input
    scale: Vector3Input
    materialId: String
    metadata: JSON
}

# Queries

type Query {
    # AmbientLight
    getAmbientLightIntensity: Float
    getAmbientLight: AmbientLight
    getAmbientLightEnvironmentMap: String

    # Camera
    getCameraPosition: Vector3!
    getCameraTarget: Vector3!
    getCameraFOV: Float!
    getCameraNear: Float!
    getCameraFar: Float!
    getCameraType: CameraType!
    getCamera: Camera

    # Light
    getLightById(id: String!): Light
    getLightName(id: String!): String
    getLightPosition(id: String!): Vector3
    getLightColor(id: String!): Color
    getLightIntensity(id: String!): Float
    getLightRange(id: String!): Float
    getLightType(id: String!): LightType
    getLightColorMultiplier(id: String!): Float
    getLights: [Light!]!

    # Material
    getMaterialById(id: String!): Material
    getMaterialName(id: String!): String
    getMaterialAlbedo(id: String!): Color
    getMaterialMetallic(id: String!): Float
    getMaterialRoughness(id: String!): Float
    getMaterialAO(id: String!): Float
    getMaterialEmissive(id: String!): Color
    getMaterials: [Material!]!

    # Model3D
    getModel3DById(id: String!): Model3D
    getModel3DName(id: String!): String
    getModel3DFileId(id: String!): String!
    getModel3DFormat(id: String!): ModelFileFormat
    getModel3DPosition(id: String!): Vector3
    getModel3DRotation(id: String!): Vector3
    getModel3DScale(id: String!): Vector3
    getModel3DMaterialId(id: String!): String
    getModel3Ds: [Model3D!]!

    # Scene
    getScene: Scene
    hasScene: Boolean!

    # User
    getApiKey(userId: String!): String
}

# Mutations

type Mutation {
    # AmbientLight
    updateAmbientLightIntensity(intensity: Float!): MutationResult!
    updateAmbientLightEnvironmentMap(environmentMap: String): MutationResult!

    # Camera
    updateCameraPosition(position: Vector3Input!): MutationResult!
    updateCameraTarget(target: Vector3Input!): MutationResult!
    updateCameraFOV(fov: Float!): MutationResult!
    updateCameraNear(near: Float!): MutationResult!
    updateCameraFar(far: Float!): MutationResult!
    updateCameraType(type: CameraType!): MutationResult!

    # Light
    updateLightName(id: String!, name: String!): MutationResult!
    updateLightPosition(id: String!, position: Vector3Input!): MutationResult!
    updateLightColor(id: String!, color: ColorInput!): MutationResult!
    updateLightIntensity(id: String!, intensity: Float!): MutationResult!
    updateLightRange(id: String!, range: Float!): MutationResult!
    updateLightType(id: String!, type: LightType!): MutationResult!
    updateLightColorMultiplier(
        id: String!
        colorMultiplier: Float!
    ): MutationResult!
    createLight(light: LightInput!): String!
    removeLight(lightId: String!): MutationResult!

    # Material
    updateMaterialName(id: String!, name: String!): MutationResult!
    updateMaterialAlbedo(id: String!, albedo: ColorInput!): MutationResult!
    updateMaterialMetallic(id: String!, metallic: Float!): MutationResult!
    updateMaterialRoughness(id: String!, roughness: Float!): MutationResult!
    updateMaterialAO(id: String!, ao: Float!): MutationResult!
    updateMaterialEmissive(id: String!, emissive: ColorInput!): MutationResult!
    createMaterial(material: MaterialInput!): String!
    removeMaterial(materialId: String!): MutationResult!

    # Model3D
    updateModel3DName(id: String!, name: String!): MutationResult!
    updateModel3DFileId(id: String!, fileId: String!): MutationResult!
    updateModel3DFormat(id: String!, format: ModelFileFormat!): MutationResult!
    updateModel3DPosition(id: String!, position: Vector3Input!): MutationResult!
    updateModel3DRotation(id: String!, rotation: Vector3Input!): MutationResult!
    updateModel3DScale(id: String!, scale: Vector3Input!): MutationResult!
    updateModel3DMaterialId(id: String!, materialId: String!): MutationResult!
    createModel3D(model3d: Model3DInput!): String!
    removeModel3D(modelId: String!): MutationResult!

    # Scene
    createOrResetScene: MutationResult!
    deleteScene: MutationResult!

    # User
    updateApiKey(userId: String!, apiKey: String!): MutationResult!
}
